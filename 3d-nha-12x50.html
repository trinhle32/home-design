<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhà vườn 12x50 3D</title>
<style>
  :root{--bg:#e9eef2;--ink:#1f2328;--panel:rgba(255,255,255,.92);--line:#d6d3cc}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #c{display:block;width:100%;height:100%}
  .panel{position:absolute;left:16px;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:300px;backdrop-filter:blur(6px)}
  .panel h1{font-size:16px;margin:0 0 6px}
  .panel p{margin:0 0 8px;color:#6b7280;font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  button,label.tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#f4f1ea}
  label.tg{display:inline-flex;align-items:center;gap:6px}
  .hint{position:absolute;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:#6b7280}
  #err{position:absolute;left:16px;bottom:16px;background:#fff3f3;border:1px solid #f3b4b4;color:#8a1c1c;padding:8px 12px;border-radius:10px;display:none;max-width:420px;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>Nhà vườn 12 × 50 m, mái Nhật (PA3)</h1>
  <p>Kéo chuột để xoay, lăn để zoom, chuột phải để dịch. Mô hình khối để xem tỉ lệ và bố cục, chưa phải render nội thất.</p>
  <div class="row">
    <button data-view="front">Góc trước</button>
    <button data-view="back">Sân sau</button>
    <button data-view="top">Nhìn từ trên</button>
    <button data-view="side">Bên hông</button>
  </div>
  <div class="row">
    <label class="tg"><input type="checkbox" id="roof" checked> Hiện mái</label>
    <label class="tg"><input type="checkbox" id="trees" checked> Cây xanh</label>
    <label class="tg"><input type="checkbox" id="labels" checked> Nhãn</label>
  </div>
</div>
<div class="hint">Tắt "Hiện mái" để xem bố trí phòng bên trong (tên phòng hiện khi mở mái)</div>
<div id="err"></div>

<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});

renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
// sky dome
{const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#6fa5d8');gr.addColorStop(.55,'#cfe3f3');gr.addColorStop(1,'#eef1ee');x.fillStyle=gr;x.fillRect(0,0,4,256);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const sky=new THREE.Mesh(new THREE.SphereGeometry(300,24,16),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide}));sky.position.set(25,0,6);scene.add(sky);}
scene.fog=new THREE.Fog(0xe3ecf2,120,300);
const camera=new THREE.PerspectiveCamera(42,1,0.1,600);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2-0.02; controls.target.set(25,1,6);
scene.add(new THREE.HemisphereLight(0xdfeeff,0x8a9a70,0.9));
const sun=new THREE.DirectionalLight(0xfff1dc,1.7); sun.position.set(-30,30,-42); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-45;sc.right=45;sc.top=45;sc.bottom=-45;sc.near=1;sc.far=160; sun.shadow.bias=-0.0006;
sun.target.position.set(25,0,6); scene.add(sun,sun.target);

// procedural textures
function tex(fn,w=256,h=256,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);return t;}
const grassT=tex((x,w,h)=>{x.fillStyle='#86b465';x.fillRect(0,0,w,h);for(let i=0;i<4000;i++){x.fillStyle=Math.random()<.5?'#7aa85a':'#93c070';x.fillRect(Math.random()*w,Math.random()*h,2,3);}},256,256,[25,6]);
const roofT=tex((x,w,h)=>{x.fillStyle='#4b4f55';x.fillRect(0,0,w,h);x.strokeStyle='#3a3d42';x.lineWidth=2;for(let y=0;y<h;y+=16){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();}for(let y=0;y<h;y+=16){for(let X=(y/16%2)*20;X<w;X+=40){x.fillStyle='#565a60';x.fillRect(X,y+2,18,12);}}},256,256,[6,6]);
const pavT=tex((x,w,h)=>{x.fillStyle='#d6d3cc';x.fillRect(0,0,w,h);x.strokeStyle='#bdb9b1';x.lineWidth=3;x.strokeRect(2,2,w-4,h-4);},128,128,[8,4]);
const woodT=tex((x,w,h)=>{x.fillStyle='#b5763f';x.fillRect(0,0,w,h);for(let i=0;i<40;i++){x.fillStyle=`rgba(80,40,10,${Math.random()*.25})`;x.fillRect(0,Math.random()*h,w,2);}},128,128,[2,2]);

const M={
  wall:new THREE.MeshStandardMaterial({color:0xf7f5f0,roughness:.9}),
  roof:new THREE.MeshStandardMaterial({map:roofT,roughness:.8,side:THREE.DoubleSide}),
  wood:new THREE.MeshStandardMaterial({map:woodT,roughness:.8}),
  glass:new THREE.MeshPhysicalMaterial({color:0x8fb3c9,roughness:.1,metalness:.2,transparent:true,opacity:.55}),
  black:new THREE.MeshStandardMaterial({color:0x202226,roughness:.6,metalness:.3}),
  lawn:new THREE.MeshStandardMaterial({map:grassT,roughness:1}),
  paved:new THREE.MeshStandardMaterial({map:pavT,roughness:.95}),
  paved2:new THREE.MeshStandardMaterial({color:0xc9c5bd,roughness:.95}),
  water:new THREE.MeshPhysicalMaterial({color:0x6fa8c9,roughness:.15,metalness:.1,transparent:true,opacity:.85}),
  leaf:new THREE.MeshStandardMaterial({color:0x5f9a4a,roughness:1}),
  leaf2:new THREE.MeshStandardMaterial({color:0x7fb55e,roughness:1}),
  trunk:new THREE.MeshStandardMaterial({color:0x6b4a2b,roughness:1}),
  inner:new THREE.MeshStandardMaterial({color:0xefece4,roughness:.9}),
  floor:new THREE.MeshStandardMaterial({color:0xe6dcc8,roughness:.9}),
  deck:new THREE.MeshStandardMaterial({color:0xc99a62,roughness:.9}),
  grey:new THREE.MeshStandardMaterial({color:0x8a8f96,roughness:.9}),
  white:new THREE.MeshStandardMaterial({color:0xf0f0f0,roughness:.9}),
};

// x = depth from street, z = width across lot, y = up
const G=new THREE.Group(); scene.add(G);
function box(d1,d2,w1,w2,y0,y1,mat,parent=G,shadow=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(d2-d1,y1-y0,w2-w1),mat); mesh.position.set((d1+d2)/2,(y0+y1)/2,(w1+w2)/2);
  mesh.castShadow=shadow; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}
function slab(d1,d2,w1,w2,y,mat,parent=G){return box(d1,d2,w1,w2,y-0.02,y,mat,parent,false);}
function hipRoof(d1,d2,w1,w2,y0,pitch=30,parent=G){
  const L=d2-d1, Wd=w2-w1, t=Math.tan(pitch*Math.PI/180);
  const short=Math.min(L,Wd), long=Math.max(L,Wd);
  const h=y0+short/2*t; const cx=(d1+d2)/2, cz=(w1+w2)/2, r=(long-short)/2;
  const A=L>=Wd?[cx-r,h,cz]:[cx,h,cz-r], B=L>=Wd?[cx+r,h,cz]:[cx,h,cz+r];
  const P=[[d1,y0,w1],[d2,y0,w1],[d2,y0,w2],[d1,y0,w2],A,B];
  const faces=L>=Wd?[[0,1,5,4],[1,2,5],[2,3,4,5],[3,0,4]]:[[0,1,4],[1,2,5,4],[2,3,5],[3,0,4,5]];
  const pos=[],uv=[];
  faces.forEach(f=>{for(let i=1;i<f.length-1;i++){[f[0],f[i+1],f[i]].forEach(k=>{pos.push(...P[k]);uv.push(P[k][0]/2,P[k][2]/2);});}});
  [[0,1,2],[0,2,3]].forEach(f=>f.forEach(k=>{pos.push(...P[k]);uv.push(0,0);}));
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,M.roof); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh);
  const band=new THREE.Group();
  box(d1,d2,w1,w1+0.06,y0-0.25,y0,M.wall,band); box(d1,d2,w2-0.06,w2,y0-0.25,y0,M.wall,band);
  box(d1,d1+0.06,w1,w2,y0-0.25,y0,M.wall,band); box(d2-0.06,d2,w1,w2,y0-0.25,y0,M.wall,band);
  parent.add(band); return mesh;
}
const trees=new THREE.Group(); G.add(trees);
function tree(d,w,h,r){
  const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,h,8),M.trunk); tr.position.set(d,h/2,w); tr.castShadow=true; g.add(tr);
  for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(r*(1-i*.18),12,9),i%2?M.leaf2:M.leaf); c.position.set(d+(i?(Math.random()-.5)*r:0),h+r*0.5+i*r*.45,w+(i?(Math.random()-.5)*r:0)); c.castShadow=true; g.add(c);}
  trees.add(g);
}
function shrub(d,w,r){const c=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),M.leaf2);c.position.set(d,r*0.7,w);c.scale.y=.75;c.castShadow=true;trees.add(c);}

// ground & yard
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0xcfd6cc,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.set(25,-0.05,6); ground.receiveShadow=true; scene.add(ground);
box(-6,0,-30,42,-0.06,0.0,new THREE.MeshStandardMaterial({color:0x9aa0a6,roughness:1}),G,false);
slab(0,50,0,12,0.0,M.lawn);
slab(0,13,4.5,12,0.02,M.paved);
const pond=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.04,32),M.water); pond.scale.set(1.4,1,0.9); pond.position.set(11.2,0.03,10.5); G.add(pond);
[[2.3,1.2],[7.4,1.6],[6.6,3.3]].forEach(([d,w])=>{const r=new THREE.Mesh(new THREE.DodecahedronGeometry(0.35),M.grey);r.position.set(d,0.25,w);r.castShadow=true;G.add(r);});
slab(13,25.5,9.3,12,0.02,M.paved);
slab(25.5,41.9,11.0,12,0.02,M.paved2);           // hẻm 1 m
slab(41.1,44.6,4.4,5.6,0.02,M.paved);

[9.2,10.2,11.2].forEach(w=>box(44.6,47.8,w,w+0.02,2.0,2.02,M.black,G,false));
[[44.6],[47.8]].forEach(([d])=>[9,11.4].forEach(w=>box(d-0.04,d+0.04,w-0.04,w+0.04,0,2.05,M.black)));

// fence & gates & carport

box(0,50,-0.15,0,0,FH,M.wall); box(0,50,12,12.15,0,FH,M.wall); box(49.85,50,0,12,0,FH,M.wall);

box(-0.08,0,5.6,6.9,0.05,FH-0.1,M.wood);
box(-0.06,0,7.1,11.9,0.05,FH-0.1,M.black);
box(3,9,8.5,12,2.6,2.75,M.black);
[3.3,8.7].forEach(d=>box(d-0.08,d+0.08,11.7,11.86,0,2.6,M.black));
{const car=new THREE.Group(); box(4,8.3,9.3,11.2,0.35,1.0,new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.4,metalness:.3}),car); box(4.9,7.6,9.5,11.0,1.0,1.55,M.glass,car);
[[4.8,9.4],[4.8,11.1],[7.5,9.4],[7.5,11.1]].forEach(([d,w])=>{const wh=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.25,16),M.black);wh.rotation.x=Math.PI/2;wh.position.set(d,.33,w);car.add(wh);}); G.add(car);}

// ---------- HOUSE ----------
const H=3.6, T=0.2;
const house=new THREE.Group(); G.add(house);
// floors
slab(13,15.5,1.8,9.3,0.15,M.paved2,house);
slab(15.5,25.5,1.8,9.3,0.16,M.floor,house);
slab(25.5,41.1,0,11.0,0.15,M.floor,house); slab(39.3,41.7,0,2.6,0.16,M.floor,house); slab(39.3,41.7,8.4,11.0,0.16,M.floor,house);

for(let w=2.55;w<4.5;w+=0.25) box(15.5-0.06,15.5,w,w+0.1,0.9,2.3,M.wood,house,false);   // lam gỗ trước gian thờ
box(15.5,15.5+T,5.3,6.0,0,H,M.wall,house); box(15.5,15.5+T,8.0,9.3,0,H,M.wall,house); box(15.5,15.5+T,5.3,9.3,2.6,H,M.wall,house);
box(15.52,15.6,6.0,8.0,0.15,2.6,M.glass,house,false);
[6.0,7.0,8.0].forEach(w=>box(15.5,15.5+T,w-0.04,w+0.04,0,2.6,M.black,house));
box(15.5-0.03,15.5+T+0.03,8.3,9.1,0.9,2.3,M.glass,house,false);
[[13.2,2.0],[13.2,9.1]].forEach(([d,w])=>box(d-0.15,d+0.15,w-0.15,w+0.15,0,H,M.wall,house));
// round window on gian thờ side wall
{const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.26,32),M.black);ring.rotation.x=Math.PI/2;ring.position.set(17.7,1.9,1.8+T/2);house.add(ring);
 const gl=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.3,32),M.glass);gl.rotation.x=Math.PI/2;gl.position.set(17.7,1.9,1.8+T/2);house.add(gl);}
box(21.5,24.5,1.8-0.02,1.8+T+0.02,0.6,2.6,M.glass,house,false);   // living left glass
box(21,24.5,9.3-T-0.02,9.3+0.02,0.6,2.6,M.glass,house,false);     // living right glass
// cross wing exterior
box(25.5,25.5+T,0,1.8,0,H,M.wall,house); box(25.5,25.5+T,9.3,11.0,0,H,M.wall,house);
box(25.5,41.7,0,T,0,H,M.wall,house); box(25.5,41.7,11.0-T,11.0,0,H,M.wall,house);
box(39.3-T,39.3,2.6,8.4,0,H,M.wall,house);
box(39.3,41.7,2.6-T,2.6,0,H,M.wall,house); box(41.7-T,41.7,0,2.6,0,H,M.wall,house); box(39.3,41.7,8.4,8.4+T,0,H,M.wall,house); box(41.7-T,41.7,8.4,11.0,0,H,M.wall,house);
function win(d,w1,w2,y0=0.9,y1=2.4){box(d-0.03,d+0.03,w1,w2,y0,y1,M.glass,house,false);box(d-0.04,d+0.04,w1,w1+0.05,y0,y1,M.black,house,false);box(d-0.04,d+0.04,w2-0.05,w2,y0,y1,M.black,house,false);}
function winZ(w,d1,d2,y0=2.0,y1=2.7){box(d1,d2,w-0.03,w+0.03,y0,y1,M.glass,house,false);}
win(25.5,0.3,1.5,1.9+0.15,2.6+0.15); win(25.5,9.5,10.8);
winZ(11.0,27,29); winZ(11.0,32,33.2); winZ(11.0,37.4,38.8); winZ(11.0,40,41.2);            // cửa sổ cao ra hẻm
win(41.7,0.5,2.1,1.6,2.5); win(41.7,8.9,10.5,1.6,2.5); win(39.3,2.9,4.3,0.2,2.5); win(39.3,6.7,8.1,0.2,2.5);
box(39.3-0.02,39.3+0.02,4.7,6.3,0,2.3,M.wood,house,false);

// interior partitions
const inner=new THREE.Group(); house.add(inner); const IH=3.2, TI=0.12;
function iw(d1,w1,d2,w2){ if(d1===d2) box(d1-TI/2,d1+TI/2,Math.min(w1,w2),Math.max(w1,w2),0,IH,M.inner,inner); else box(Math.min(d1,d2),Math.max(d1,d2),w1-TI/2,w1+TI/2,0,IH,M.inner,inner); }
iw(15.5,5.3,17,5.3); iw(18.2,5.3,20,5.3); iw(20,1.8,20,5.3);
iw(25.5,1.8,25.5,3.0); iw(25.5,8.0,25.5,9.3);
iw(25.5,2.8,30.5,2.8); iw(31.3,2.8,33.7,2.8); iw(29.7,8.2,32.0,8.2); iw(32.8,8.2,33.7,8.2); iw(29.7,8.2,29.7,11.0);
box(25.7,29.5,8.17,8.23,0.15,IH,M.glass,inner,false);
iw(31.5,0,31.5,1.9); iw(31.5,2.8,31.5,4.0); iw(31.5,7.9,31.5,8.2);
iw(31.5,1.9,32.2,1.9); iw(33.0,1.9,33.7,1.9);
iw(33.7,0,33.7,3.2); iw(33.7,4.1,33.7,4.6); iw(33.7,6.4,33.7,7.3); iw(33.7,8.2,33.7,11.0);
iw(33.7,4.5,39.3,4.5); iw(33.7,6.5,39.3,6.5);
iw(39.3,0,39.3,0.9); iw(39.3,1.8,39.3,2.6); iw(39.3,8.4,39.3,9.3); iw(39.3,10.2,39.3,11.0);
// interior hints
box(19.45,19.95,2.6,4.5,0.15,1.0,M.wood,inner);                 // bàn thờ
box(25.6,29.6,10.4,10.95,0.15,1.0,M.wood,inner); box(26.0,29.0,8.35,9.25,0.15,1.0,M.deck,inner); box(26.75,27.65,3.3,6.3,0.7,0.78,M.wood,inner); box(29.35,30.25,3.3,6.3,0.7,0.78,M.wood,inner);
[[25.8,27.4,0.05,2.05],[28.3,29.9,0.05,2.05],[31.6,33.6,9.9,10.9],[35.3,37.1,0.1,2.1],[35.3,37.1,8.9,10.9]].forEach(([a,b,c,d])=>box(a,b,c,d,0.15,0.55,M.white,inner));
box(19.85,20.15,6.2,8.2,0.15,2.4,M.wood,inner);   // lam gỗ bình phong
box(29.8,30.4,8.4,9.8,0.7,0.76,M.wood,inner); box(21.0,24.3,5.7,6.6,0.15,0.75,new THREE.MeshStandardMaterial({color:0x9a9a94}),inner);

// roofs
const roofs=new THREE.Group(); G.add(roofs);
hipRoof(12.2,26.3,1.0,10.1,H,30,roofs);

function makeLabel(text,d,w,y,size=1.1,grp=labels){
  const c=document.createElement('canvas'); c.width=512;c.height=128; const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(0,0,512,128); ctx.fillStyle='#1f2328'; ctx.font='600 46px -apple-system,Segoe UI,Roboto,Helvetica,Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,256,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true})); sp.scale.set(size*4,size,1); sp.position.set(d,y,w); grp.add(sp);
}
